<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{{ titulo }} | PetCare</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f1f5f9; color: #0f172a; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 520px; padding: 44px 32px; background: white; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 16px 48px #0f172a0d; text-align: center; }
    .marca { font-size: 17px; font-weight: 800; color: #047857; margin-bottom: 28px; }
    .icono { display: grid; place-items: center; margin: 0 auto 24px; width: 80px; height: 80px; border-radius: 50%; font-size: 42px; font-weight: 600; }
    .exito { color: #047857; background: #d1fae5; }
    .cancelado { color: #b45309; background: #fef3c7; }
    .rechazado { color: #b91c1c; background: #fee2e2; }
    .pendiente { color: #0369a1; background: #e0f2fe; }
    h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; }
    p { color: #475569; line-height: 1.6; margin: 0 0 20px; }
    .regreso { font-size: 14px; }
    a { display: block; padding: 14px 20px; border-radius: 12px; background: #047857; color: white; font-weight: 700; text-decoration: none; }
    a:hover { background: #065f46; }
    a:focus-visible { outline: 3px solid #0f172a; outline-offset: 4px; }
    .nota { margin-top: 24px; font-size: 12px; color: #64748b; }
    @media (max-width: 480px) { main { padding: 32px 20px; } h1 { font-size: 24px; } }
  </style>
</head>
<body>
  <main>
    <div class="marca">PetCare · Webpay de prueba</div>
    <div class="icono {{ estilo }}" aria-hidden="true">{{ icono }}</div>
    <div role="status">
      <h1>{{ titulo }}</h1>
      <p>{{ descripcion }}</p>
    </div>
    <p class="regreso" id="regreso">Volviendo a la sección de pago en 6 segundos…</p>
    <a href="{{ destino }}" id="volver">Volver ahora a la sección de pago</a>
    <div class="nota">Ambiente de simulación · Sin cobros reales</div>
    <noscript><p class="regreso">Pulsa el botón para volver a tu cuenta.</p></noscript>
  </main>
  {{ destino|json_script:'destino-pago' }}
  <script>
    const destino = JSON.parse(document.getElementById('destino-pago').textContent);
    let segundos = 6;
    const intervalo = setInterval(() => {
      segundos -= 1;
      if (segundos <= 0) {
        clearInterval(intervalo);
        window.location.replace(destino);
      } else {
        document.getElementById('regreso').textContent = `Volviendo a la sección de pago en ${segundos} segundos…`;
      }
    }, 1000);
  </script>
</body>
</html>
