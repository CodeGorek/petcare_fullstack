{% extends "clinica/base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="saas-card p-4">
      <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
        <h5 class="fw-bold mb-0">{{ titulo }}</h5>
        <a href="{% url 'tutores_mascotas' %}" class="btn btn-sm btn-light">Volver</a>
      </div>
      <form method="post">
        {% csrf_token %}
        <div class="row g-3">
          {% for field in form %}
          <div class="col-md-6">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
          </div>
          {% endfor %}
        </div>
        <div class="mt-4 d-flex gap-2 justify-content-end">
          <a href="{% url 'tutores_mascotas' %}" class="btn btn-light">Cancelar</a>
          <button type="submit" class="btn btn-emerald">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
